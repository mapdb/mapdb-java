name: build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mapdb-java
        uses: actions/checkout@v4

      - name: Set up JDK 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Build + install the core modules (new GAVs) into the local repo. The
      # -am also installs the code-generator and its Maven plugin, which the
      # unit-test modules need to generate their test sources. Sources are
      # generated from the .stg templates on every build, so a clean build is
      # inherently a clean-generate. Checkstyle stays skip-by-default per the
      # v1 decision.
      - name: Build core modules
        run: |
          mvn clean install -DskipTests -Dcheckstyle.skip=true \
            -pl eclipse-collections-api,eclipse-collections,eclipse-collections-forkjoin,eclipse-collections-testutils \
            -am

      # The kept inherited unit-test suites guard the behaviour the fork
      # changes (raw-bit float identity, Fibonacci spread, the rename). They
      # are green against the fork's contract and MUST stay green.
      - name: Run inherited unit-test suites
        run: |
          mvn test -Dcheckstyle.skip=true \
            -pl unit-tests,unit-tests-java8,unit-tests-thread-safety

      # The cross-language conformance scenarios live in a SIBLING repo
      # (mapdb/mapdb-collection-spec). That repo is currently PRIVATE, so an
      # unauthenticated clone fails ("could not read Username"). For now the
      # clone is non-blocking and the validator runs only when it succeeds, so
      # this build no longer goes red purely because the spec repo is private.
      # TODO: restore the hard conformance gate once the spec repo is public
      # again, or authenticate the clone with a repo-scoped token secret, e.g.
      #   git clone https://x-access-token:${{ secrets.SPEC_REPO_TOKEN }}@github.com/mapdb/mapdb-collection-spec.git
      - name: Clone spec scenarios
        id: clone_spec
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/mapdb/mapdb-collection-spec.git \
            "${{ runner.temp }}/mapdb-collection-spec"

      - name: Build + run cross-language validator (298 scenarios)
        if: steps.clone_spec.outcome == 'success'
        run: |
          mvn -f mapdb-validation/pom.xml clean package
          java -jar mapdb-validation/target/mapdb-validation.jar \
            "${{ runner.temp }}/mapdb-collection-spec/cross-language-validation/scenarios"

      # Without this, a green build is ambiguous: it can mean "conformance
      # passed" or "conformance never ran because the clone failed". Say which.
      - name: Warn that conformance did not run
        if: steps.clone_spec.outcome != 'success'
        run: |
          echo "::warning title=Conformance suite skipped::Spec clone failed \
          (repo is private); the 298 cross-language scenarios did NOT run in \
          this build. This job being green says nothing about conformance."
          echo "> **Conformance suite did NOT run** — the spec clone failed." \
            >> "$GITHUB_STEP_SUMMARY"

      # Native (port-specific) tests depend on the locally-installed core
      # SNAPSHOTs from the "Build core modules" step.
      - name: Run native (port-specific) tests
        run: mvn -f mapdb-native-tests/pom.xml test
